    <main class="formulario-pagina">

        <!-- ================= TÍTULO ================= -->
        <h1 class="cta-titulo formulario-titulo">¿HACEMOS ALGO <span>DISTINTO?</span></h1>

        <!-- ================= FORMULARIO ================= -->
        <form class="formulario" action="#" method="post">
            <div class="formulario-caja">

                <div class="campos-contacto">
                    <input type="text" name="nombre" class="campo" placeholder="NOMBRE Y APELLIDO">
                    <input type="email" name="email" class="campo" placeholder="E-MAIL">
                    <input type="tel" name="telefono" class="campo" placeholder="TELÉFONO">
                </div>

                <textarea name="mensaje" class="campo campo-mensaje" placeholder="Contame brevemente qué necesitas o tu idea y me pondré en contacto con vos para darte la mejor respuesta!"></textarea>

            </div>

            <button type="submit" class="btn btn-verde btn-enviar">Enviar</button>
        </form>

        <div class="formulario-volver">
            <a href="index.html" class="btn btn-naranja btn-chico">Volver</a>
        </div>

    </main>
